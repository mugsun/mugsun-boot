# Mugsun 一条命令起全套：PostgreSQL(PostGIS+pgvector) + Redis + 后端 + 管理台(mugsun-pc 镜像，Nginx 反代 /api)
#
#   docker compose -f docker-compose.full.yml up -d --build
#   浏览器打开 http://localhost:8088 ，账号 admin，口令（不写日志）：
#   docker compose -f docker-compose.full.yml run --rm init show
#
# 只需要 Docker（Compose v2.17+）。管理台直接用 mugsun-pc 仓库自己的 Dockerfile 和 nginx 配置构建
# （nginx-unprivileged 非 root、基础镜像固定 digest、CSP、用 $remote_addr 覆盖 X-Forwarded-For），
# 源码钉在下面 MUGSUN_PC_SRC 默认 tip sha（可复现，不跟浮动 main；升级时改 tip+注释）。
# 默认 tip 登录页为行为验证码弹层（非旧扭曲数字图）；与 boot prod 的 mugsun.captcha 对齐。
# 钉死的 pc tip 已 npm 依赖 @mugsun/track-web，构建不再需要 additional_contexts.track。
# 本地已有平级 mugsun-pc 时可改用本地源码：
#   MUGSUN_PC_SRC=../mugsun-pc docker compose -f docker-compose.full.yml up -d --build
#
# 默认安全：不带任何弱口令。首次启动由 init 生成数据库/Redis 口令、管理员口令与 SM4/SM2/文件签名密钥，
# 按服务拆进三个 secrets 卷（每个文件 0600、属主是对应服务用户），每个服务只挂自己的卷；重启不变。
# 后端以 prod 配置运行（strict-keys、验证码开启、OpenAPI 关闭）。
# 管理台端口默认只绑 127.0.0.1:8088；要给局域网访问显式设 MUGSUN_HTTP_BIND=0.0.0.0。数据库和 Redis 不映射到宿主机。
# 网段默认占 172.30.88.0/24，和宿主机上别的网段冲突时改 MUGSUN_NET_PREFIX（写前三段，比如 10.88.0）。
# 管理台、后端、数据库、Redis 用网段里的固定地址（.10、.12、.13、.14，和微服务版 mugsun-cloud 的编号对应），
# 容器之间按地址找对方，不按名字：一个容器没在运行时，Docker 会把它的名字交给宿主机的 DNS 去查，
# 查到什么地址，请求和口令就发到哪里；管理台的 Nginx 还只在启动时查一次，查错了要等重启才改得过来。
# 以前用 MUGSUN_COMPOSE_SUBNET / MUGSUN_COMPOSE_IP_RANGE / MUGSUN_PC_IP 改过网段的：这三个变量照旧生效，
# 但后端、数据库、Redis 的地址只跟 MUGSUN_NET_PREFIX 走，要把它设成同一个网段的前三段。
# 已经起过的环境换网段：先 down（不带 -v，数据和密钥都留着），再带着新的 MUGSUN_NET_PREFIX 执行 up -d。
# 时区：四个常驻容器（postgres / redis / boot / pc）默认都是 Asia/Shanghai，换时区设 MUGSUN_TZ=<IANA 名称>（如 UTC）。
# 库里的时间列不带时区，按后端 JVM 的时区写入、页面原样显示，所以后端容器的时区就是页面上看到的时区。
# 给已经在跑的环境改时区不会改写旧数据：之前写入的时间保持原来的钟点。
# 清空重来只能用（会删数据和密钥）：docker compose -f docker-compose.full.yml down -v
# 不要单删 secrets 卷而保留 pg-data：库口令只在首次初始化时写入，新生成的口令会对不上。
name: mugsun-full

services:
  init:
    build:
      context: .
      dockerfile: docker/full/init.Dockerfile
    image: mugsun-full-init:local
    volumes:
      - secrets-boot:/secrets/boot
      - secrets-postgres:/secrets/postgres
      - secrets-redis:/secrets/redis

  postgres:
    # 默认拉取 GHCR 多架构 PostGIS+pgvector；钉 digest 用 MUGSUN_PG_IMAGE=...@sha256:...
    # 改 Dockerfile：docker compose -f docker-compose.full.yml build postgres
    image: ${MUGSUN_PG_IMAGE:-ghcr.io/mugsun/postgis-pgvector:16-3.4}
    pull_policy: missing
    build:
      context: ./docker/postgres
    # 超级用户 postgres 与应用账号 mugsun 用同一随机口令（只挂 postgres 专用的 secrets 卷，里面只有库口令），库只在 compose 内网可达
    entrypoint: ["sh", "-c", ". /secrets/db.env && export POSTGRES_PASSWORD=\"$$MUGSUN_DB_PASSWORD\" && exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_USER: postgres
      # TZ：首次初始化时 initdb 按它写库的默认时区（已有数据卷的库默认时区不变）；PGTZ：容器里 psql 等客户端的会话时区
      TZ: ${MUGSUN_TZ:-Asia/Shanghai}
      PGTZ: ${MUGSUN_TZ:-Asia/Shanghai}
    volumes:
      - secrets-postgres:/secrets:ro
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/initdb/init-db.sql:ro
      - ./docker/postgres/00-init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      default:
        ipv4_address: ${MUGSUN_NET_PREFIX:-172.30.88}.13
    # 停止时等进程自己收尾退出，到时间还没退才强杀。四个常驻服务都写明这个时间：不写就按 Docker 的默认值，
    # 有的环境里默认只有 1 秒，数据库和后端来不及收尾就被杀掉
    stop_grace_period: 60s
    restart: unless-stopped

  redis:
    # 与 mugsun-pc#18 同一 digest
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # 口令不进进程参数：gen-secrets 生成 /secrets/redis.conf（requirepass，0600 属 redis），这里只传配置文件路径
    command: ["redis-server", "/secrets/redis.conf"]
    environment:
      TZ: ${MUGSUN_TZ:-Asia/Shanghai}
    volumes:
      - secrets-redis:/secrets:ro
      - redis-data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /secrets/redis.conf)\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        ipv4_address: ${MUGSUN_NET_PREFIX:-172.30.88}.14
    stop_grace_period: 30s
    restart: unless-stopped

  boot:
    build:
      context: .
      dockerfile: docker/full/boot.Dockerfile
    image: mugsun-full-boot:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # JVM 默认时区：应用取的当前时间和数据库会话的 now() 都跟它走（PostgreSQL 驱动建连时把会话时区设成 JVM 时区）
      TZ: ${MUGSUN_TZ:-Asia/Shanghai}
      # 数据库和 Redis 按固定地址连，原因见文件开头
      JDBC_URL: jdbc:postgresql://${MUGSUN_NET_PREFIX:-172.30.88}.13:5432/mugsun
      JDBC_USERNAME: mugsun
      TRACK_JDBC_URL: jdbc:postgresql://${MUGSUN_NET_PREFIX:-172.30.88}.13:5432/mugsun_track
      TRACK_JDBC_USERNAME: mugsun
      REDIS_HOST: ${MUGSUN_NET_PREFIX:-172.30.88}.14
      REDIS_DB: "3"
      MUGSUN_FRONT_URL: http://localhost:${MUGSUN_HTTP_PORT:-8088}
      FILE_DOMAIN: http://localhost:${MUGSUN_HTTP_PORT:-8088}/api/file/
      # 演示栈不配邮件/短信；需要时在此覆盖为真实值
      SMTP_HOST: smtp.invalid
      SMTP_USERNAME: unset
      SMTP_PASSWORD: unset
      SMS_AK: unset
      SMS_SK: unset
      SMS_SIGNATURE: unset
      SMS_TEMPLATE_ID: unset
      # 只信任 pc（Nginx）容器的固定 IP 传来的 X-Forwarded-For，不信任整个子网；
      # pc 的 nginx 用 $remote_addr 覆盖 XFF（不保留客户端自带的），前置网关由 pc 侧 MUGSUN_GATEWAY_CIDRS 处理
      MUGSUN_OPENAPI_TRUSTED_PROXIES: ${MUGSUN_PC_IP:-${MUGSUN_NET_PREFIX:-172.30.88}.10}/32
    volumes:
      - secrets-boot:/secrets:ro
      - files:/var/lib/mugsun/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /ping HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    networks:
      default:
        # 固定地址：管理台按这个地址把请求转过来
        ipv4_address: ${MUGSUN_NET_PREFIX:-172.30.88}.12
    # 应用自己的优雅停机最多等 20 秒（spring.lifecycle.timeout-per-shutdown-phase），这里留一倍
    stop_grace_period: 40s
    restart: unless-stopped

  pc:
    # 直接用 mugsun-pc 仓库的 Dockerfile + docker/nginx（非 root、digest 钉版、CSP、网关 CIDR、
    # XFF 覆盖）。这里不再维护单独的 nginx 配置。源码钉可复现 tip（不跟浮动 main）；
    # pc 镜像里 pnpm 用 --frozen-lockfile。登录页为行为验证码（CaptchaDialog），非旧数字图。
    # pc tip 8b123c5（含 KB upload-file；#19 行为验证码/去数字码/CSP #63；
    # npm @mugsun/track-web@0.3.0，勿再加 additional_contexts.track）。
    build:
      context: ${MUGSUN_PC_SRC:-https://github.com/mugsun/mugsun-pc.git#8b123c5db7b75fa48c1c2f2d5f2736d911278df1}
      dockerfile: Dockerfile
    image: mugsun-full-pc:local
    environment:
      # 写后端的固定地址，不写名字：Nginx 只在启动时把名字解析一次，那时后端要是没在运行，
      # 查到的是宿主机的 DNS 给的地址，之后的请求一直发到那里，重启管理台才改得过来
      MUGSUN_API_UPSTREAM: http://${MUGSUN_NET_PREFIX:-172.30.88}.12:8080
      TZ: ${MUGSUN_TZ:-Asia/Shanghai}
      # 前置网关（TLS 终端/负载均衡）网段，逗号分隔；默认空 = 不信任任何前置代理传来的 XFF
      MUGSUN_GATEWAY_CIDRS: ${MUGSUN_GATEWAY_CIDRS:-}
      MUGSUN_CSP_TILE_HOSTS: ${MUGSUN_CSP_TILE_HOSTS:-}
      MUGSUN_CSP_TRACK_HOSTS: ${MUGSUN_CSP_TRACK_HOSTS:-}
    ports:
      # 容器内 nginx 以非 root（uid 101）监听 8080；宿主机默认只绑回环地址
      - "${MUGSUN_HTTP_BIND:-127.0.0.1}:${MUGSUN_HTTP_PORT:-8088}:8080"
    networks:
      default:
        ipv4_address: ${MUGSUN_PC_IP:-${MUGSUN_NET_PREFIX:-172.30.88}.10}
    depends_on:
      boot:
        condition: service_healthy
    # 页面开着的时候有一条长连接，Nginx 等不到它自己断开，所以这里只等 10 秒
    stop_grace_period: 10s
    restart: unless-stopped

  ready:
    # 一次性提示：等 boot 健康、pc 起来后向 stdout 打印登录地址与查口令命令（不打印口令）。
    # 注意：本服务 exit 0 后 `docker compose up --wait` 会误报失败（无下游
    # service_completed_successfully 依赖）；交互 up -d 不受影响。验收脚本见 #104。
    image: mugsun-full-init:local
    depends_on:
      boot:
        condition: service_healthy
      pc:
        condition: service_started
    environment:
      MUGSUN_HTTP_PORT: ${MUGSUN_HTTP_PORT:-8088}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        port="$${MUGSUN_HTTP_PORT:-8088}"
        printf '%s\n' \
          '' \
          '========================================' \
          ' mugsun 已就绪' \
          " 登录: http://127.0.0.1:$${port}" \
          ' 账号: admin' \
          ' 查看口令（口令本身不打印在此）:' \
          '   docker compose -f docker-compose.full.yml run --rm init show' \
          '========================================' \
          ''

networks:
  default:
    ipam:
      config:
        # 固定地址：.10 管理台（后端只信任它传来的客户端地址）、.12 后端、.13 PostgreSQL、.14 Redis。
        # 一次性的容器只在 .128/25 里分配地址，拿不到上面这几个。网段和这些地址默认都由 MUGSUN_NET_PREFIX 决定；
        # 旧的三个变量（网段、动态段、管理台地址，和 mugsun-pc 的 compose 同名）设了就以它们为准
        - subnet: ${MUGSUN_COMPOSE_SUBNET:-${MUGSUN_NET_PREFIX:-172.30.88}.0/24}
          ip_range: ${MUGSUN_COMPOSE_IP_RANGE:-${MUGSUN_NET_PREFIX:-172.30.88}.128/25}

volumes:
  secrets-boot:
  secrets-postgres:
  secrets-redis:
  pg-data:
  redis-data:
  files:
