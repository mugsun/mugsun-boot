name: publish-postgis-pgvector

# 多架构构建并推送 PostGIS+pgvector 到 GHCR，供 compose 默认拉取。
# 首次：在 Actions 页对该 workflow 点 Run workflow（workflow_dispatch）。
# 之后：main 上改 docker/postgres、相关 compose 或本文件也会触发。
# 不打 latest（避免浮动标签）；compose 钉死 :16-3.4。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/postgres/**
      - docker-compose.yml
      - docker-compose.full.yml
      - .github/workflows/publish-postgis-pgvector.yml

# 顶层仅 contents: read（check-workflows 约束）；推包在 job 级放开 packages
permissions:
  contents: read

jobs:
  publish:
    name: Build & push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 16-3.4 为 compose 钉死标签；16 为同系列便利标签。不推 latest。
          tags: |
            ghcr.io/mugsun/postgis-pgvector:16-3.4
            ghcr.io/mugsun/postgis-pgvector:16
          # 首次推送后包多为 private；需 org 成员在 GHCR 包设置里改为 Public，
          # 或：gh api --method PUT /orgs/mugsun/packages/container/postgis-pgvector/visibility \
          #      -f visibility=public（GITHUB_TOKEN 常无改 visibility 权限）
