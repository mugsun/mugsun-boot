name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 顶层只读权限、禁用 pull_request_target、Actions 钉 SHA
      - name: Check workflow rules
        run: python3 scripts/ci/check-workflows.py .github/workflows

      - name: Self-test check-workflows
        run: bash scripts/ci/test-check-workflows.sh

      # actionlint 钉版本并校验 sha256，不用 curl | sh
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # 全历史扫描；gitleaks 钉版本并校验 sha256；--redact 不打印密钥值
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: mugsun
          POSTGRES_USER: mugsun
          POSTGRES_PASSWORD: mugsun
        options: >-
          --health-cmd="pg_isready -U mugsun"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # 在 CI 中优先使用服务容器（Postgres/Redis），避免 Testcontainers 环境差异
      MUGSUN_TEST_USE_SERVICES: "true"
      # 与 AbstractIntegrationTest 中的默认一致
      POSTGRES_DB: mugsun
      POSTGRES_USER: mugsun
      POSTGRES_PASSWORD: mugsun
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - name: Checkout mugsun-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: mugsun/mugsun-core
          path: mugsun-core

      - name: Checkout mugsun-boot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: mugsun-boot
          fetch-depth: 0

      - name: Guard released migrations
        working-directory: mugsun-boot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-released-migrations.sh

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install mugsun-core
        working-directory: mugsun-core
        run: mvn -B -C install -DskipTests

      # B89-0：根 pom 的 bannedDependencies 规则必须真的会拦下 Spring AI 与 MCP SDK（探针工程逐个验证）
      - name: Prove banned-dependency rule trips
        working-directory: mugsun-boot
        run: scripts/check-banned-dependencies.sh

      # 信创驱动 profile 平时不进 verify；validate 一次，确保 enforcer 等规则在 full + kingbase + dameng 组合下也成立
      - name: Validate full + kingbase + dameng profiles
        working-directory: mugsun-boot
        run: mvn -B -C validate -Pfull,kingbase,dameng

      - name: Verify mugsun-boot
        working-directory: mugsun-boot
        run: mvn -B -C verify

      # 模块开关回归用例在 surefire 控制台只打印类名与条数；这里把用例名从报告 XML 列到日志里，便于核对 CI 实际跑了哪些
      - name: List module-switch ApiTest cases
        if: always()
        working-directory: mugsun-boot/mugsun-boot-server/target/surefire-reports
        run: |
          for c in AiDisabledApiTest AiEnabledApiTest ModuleGateApiTest GisApiTest; do
            for f in TEST-*."$c".xml; do
              [ -f "$f" ] || { echo "MISSING $c"; continue; }
              grep -o '<testcase name="[^"]*" classname="[^"]*"' "$f" | sed -E 's/<testcase name="([^"]*)" classname="([^"]*)"/CASE \2#\1/'
              grep -o '<testsuite [^>]*' "$f" | grep -oE '(tests|failures|errors|skipped)="[0-9]+"' | tr '\n' ' '; echo " <- $c"
            done
          done
