请填写数据源名称。用来在列表里区分=Please enter the data source name. It is used to tell data sources apart in the list.
请填写模型名称。用来在列表里区分=Please enter the model name. It is used to tell models apart in the list.
请填写渠道名称。用来在列表里区分=Please enter the channel name. It is used to tell channels apart in the list.
请填写知识库名称。用来在列表里区分=Please enter the knowledge base name. It is used to tell knowledge bases apart in the list.
请填写表名=Please enter the table name
请填写要发送的内容=Please enter the content to send
请填写连接地址。PgVector 用 jdbc:postgresql://主机:端口/库名=Please enter the connection URL, for example jdbc:postgresql://host:port/database for PgVector
请填写释义，说明这个词在问数里是什么意思=Please enter the definition to explain what this term means in data Q&A
请填写问数名称。用来在列表里区分=Please enter the data Q&A name. It is used to tell data Q&A items apart in the list.
请求编号不对。请重新发送=The request ID is not valid. Please send again.
请求编号不对。请重新发送，生成过程中再点停止=The request ID is not valid. Please send again and click Stop while it is generating.
请至少选择一张表。没有表就没法问数=Please select at least one table. Data Q&A cannot work without tables.
请选择向量模型。对话模型不能用来做知识库检索=Please select an embedding model. Chat models cannot be used for knowledge base retrieval.
请选择对话模型。向量模型不能用来聊天=Please select a chat model. Embedding models cannot be used for chat.
请选择要上传的文件=Please choose the file to upload
资料编号请填写数字，可以从列表里复制=The file ID must be a number. You can copy it from the list.
过期时间已经过了。请改成以后的时间，或留空表示不过期=The expiry time has already passed. Please set a future time, or leave it empty for no expiry.
还没有配置数据表。请先点配置，选好表后再重跑=No tables are configured yet. Please click Configure and choose the tables before rerunning.
还没有配置数据表。请先点配置，选好表后再问=No tables are configured yet. Please click Configure and choose the tables before asking.
这个分段不存在。请刷新列表后再试=This segment does not exist. Please refresh the list and try again.
这个工具已停用。请先启用再设为默认=This tool is disabled. Please enable it before setting it as default.
这个工具已锁定。请先解锁再改=This tool is locked. Please unlock it before editing.
这个模型还没激活。请先测试通过后再设为默认=This model is not activated yet. Please pass the test before setting it as default.
这个知识库已停用，对话和工作流都不会检索它。要测试命中效果，请先启用=This knowledge base is disabled, so chats and workflows will not retrieve from it. To run a hit test, please enable it first.
这个问数不存在。请从问数列表再进一次仪表盘=This data Q&A does not exist. Please open the dashboard again from the data Q&A list.
这份资料不存在。请刷新列表后再试=This file does not exist. Please refresh the list and try again.
这张表不存在。请刷新后再试=This table does not exist. Please refresh and try again.
这条回复不存在。请刷新会话后再试=This reply does not exist. Please refresh the conversation and try again.
这条回答还在生成。请等它结束或先停止后再重新生成=This answer is still being generated. Please wait until it finishes or stop it before regenerating.
这条术语不在当前问数里。请刷新后再试=This term does not belong to the current data Q&A. Please refresh and try again.
这条术语不存在。请刷新后再试=This term does not exist. Please refresh and try again.
这次没有优化成功。请确认默认对话模型已激活，稍后再试=The optimization did not succeed this time. Please make sure the default chat model is activated and try again later.
这次没有分析成功。请确认默认对话模型已激活，稍后再试=The analysis did not succeed this time. Please make sure the default chat model is activated and try again later.
这次没有得到优化结果。请确认默认对话模型已激活，稍后再试=No optimized result was returned this time. Please make sure the default chat model is activated and try again later.
这次没有解析到工具。请确认地址返回的是工具清单，再试一次=No tools were parsed this time. Please make sure the URL returns a tool list and try again.
这次没有解析成功。请检查地址能不能从本机访问，再试一次=Parsing did not succeed this time. Please check that the URL is reachable from this server and try again.
这次没有连上。请检查地址、用户名和密码后再试=The connection failed this time. Please check the URL, username and password and try again.
这次没有连上。请检查地址和密钥后再试=The connection failed this time. Please check the URL and key and try again.
这次没有预测成功。请确认默认对话模型已激活，稍后再试=The prediction did not succeed this time. Please make sure the default chat model is activated and try again later.
这次生成已经结束。刷新会话后可以看到结果=This generation has already finished. Refresh the conversation to see the result.
这段提示词还没有正文。请先填写内容再优化=This prompt has no content yet. Please enter the content before optimizing.
连接地址请控制在 128 个字符以内，并且不要带空格=Please keep the connection URL within 128 characters and without spaces
释义请控制在 2000 字以内=Please keep the definition within 2000 characters
问数名称请控制在 64 个字以内=Please keep the data Q&A name within 64 characters
限流请填 0 到 100000。0 表示不限制=The rate limit must be between 0 and 100000. A value of 0 means no limit.

# ==== ai/support ====
出站 URL 不能为空=The outbound URL cannot be empty
出站 URL 缺少主机=The outbound URL has no host
出站 URL 非法=The outbound URL is not valid
出站地址主机解析失败=Failed to resolve the host of the outbound URL
出站地址仅允许 http/https=Only http/https is allowed for outbound URLs
出站地址禁止访问云元数据地址=Outbound URLs must not point to cloud metadata addresses
出站地址禁止访问内网/元数据地址=Outbound URLs must not point to internal network or metadata addresses
出站地址禁止访问内网地址=Outbound URLs must not point to internal network addresses
出站地址端口不在允许范围内=The port of the outbound URL is not in the allowed range
分段方式请在 Markdown 标题、段落、定长、按行、按分隔符里选一种=Please choose one segmentation mode from Markdown heading, paragraph, fixed length, by line or by separator
变量只能用在值的位置（比如 where 条件里），不能用来拼表名、列名或整段查询=Variables can only be used where a value is expected (for example in a where condition), not to build table names, column names or whole queries
文件类型和扩展名对不上。请上传原始 PDF / DOCX / PPTX，不要只改后缀=The file type does not match the extension. Please upload the original PDF / DOCX / PPTX instead of just renaming the extension.
查询嵌套太深，请简化后再试=The query is nested too deeply. Please simplify it and try again.
查询没有执行成功。请检查查询的写法（表名、列名、类型）后再试=The query did not run successfully. Please check how it is written (table names, column names, types) and try again.
查询结果太大，已停止。请加上条件或减少返回的列后再试=The query result is too large and was stopped. Please add conditions or return fewer columns and try again.
知识库资料只支持 PDF、Word（.docx）、PPT（.pptx）。请换一种格式再上传=Knowledge base files only support PDF, Word (.docx) and PPT (.pptx). Please use one of these formats and upload again.
缺少记录 id=The record id is missing
请求过于频繁，请稍后重试=Too many requests. Please try again later.
这次没有查出结果。请检查数据源能不能连上，再试一次=No result was returned this time. Please check that the data source is reachable and try again.
