# 后端提示语的英文翻译。等号左边是代码里的中文原文（一个字、一个标点都不能差），右边是英文。
#
# 怎么生效：请求头 Accept-Language 是英文时，返回体里的提示语（msg）整句在这里找得到就换成英文，
# 找不到照旧返回中文。所以可以一批一批地加，没加到的句子不会出错。
#
# 写法：
#   1. 键里的等号写成 \=，其它字符（空格、冒号、中文标点）照原样写。
#   2. 原文里有 {0}、{1} 这种占位的，译文里也要有，并且译文里的单引号要写两个（It''s）。
#   3. 代码里改了原文，这里要跟着改：I18nBundleTest 会检查这里的每一句都还在代码里。
#   4. 应用想改某一句的译文，不用动这个文件：在自己的 i18n/messages_en.properties 里写同一个键，优先用应用自己的。
#
# 按包分段，段内按原文排序。

