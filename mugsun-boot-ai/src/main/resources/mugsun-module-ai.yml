# AI 模块配置（随 mugsun-boot-ai jar 提供；核心通过 optional:classpath 引入）
mugsun:
  ai:
    # AI 模块总开关：未设置按开；设置后只认 true/false，空值等其它值启动失败（MUGSUN_AI_ENABLED 同理）。
    # sys_param ai.module.enabled=false 可运行时关闭
    enabled: ${MUGSUN_AI_ENABLED:true}

    # 知识库资料上传（pdf/docx/pptx）：单文件默认 20MB，直接贴正文也按这个上限；
    # 一份资料最多切成多少段默认 5000（分段在上传请求里同步入库、向量化，段数太多会一直占着请求）
    # kb:
    #   max-upload-bytes: 20971520
    #   max-segments-per-asset: 5000

    # 业务代码用 Spring AI（注入 ChatClient.Builder）调模型时的超时，默认 5 分钟，不配也能用：
    # 普通调用指整次请求，流式指前后两段内容之间最长等多久。模型的地址、密钥在「大模型配置」页面里配，
    # 不在这里；这里的键不是 spring.ai.*，Spring AI 自己的那套配置在本项目里不起作用
    # spring-ai:
    #   timeout: 5m
