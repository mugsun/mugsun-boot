# gitleaks 配置：在默认规则上追加 allowlist。
# 新增或修改 allowlist 条目必须安全官审；只写位置和规则名，不写密钥值。
# 条目一律按「规则 + 文件 + 精确值」同时匹配才放行（AND），不按 commit 放行；
# 之后改到这些行或写入其他值仍会重新报出。

[extend]
useDefault = true

[[allowlists]]
description = "测试假值：验证码用例里的固定 captchaToken（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^mugsun-boot-core/src/test/java/com/mugsun/boot/captcha/SliderCaptchaApiTest\.java$''']
regexTarget = "secret"
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
]

[[allowlists]]
description = "测试假值：瓦片签名失败用例的固定 SECRET（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^mugsun-boot-gis/src/test/java/com/mugsun/boot/gis/GisTileServiceFailureTest\.java$''']
regexTarget = "secret"
regexes = [
  '''^SECRET\-tk\-123456$''',
]

[[allowlists]]
description = "测试假值：本地文件 URL 签名用例的固定 SECRET（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^mugsun-boot-core/src/test/java/com/mugsun/boot/system/file/LocalFileUrlSignerTest\.java$''']
regexTarget = "secret"
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
]

[[allowlists]]
description = "测试假值：集成测试注入的 mugsun.crypto.api-key（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/test/java/com/mugsun/boot/AbstractIntegrationTest\.java$''']
regexTarget = "secret"
regexes = [
  '''^mugsun\-test\-apk16$''',
]

[[allowlists]]
description = "开发默认值（已从 HEAD 移除）：早期 application.yml 的 crypto.api-key（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/main/resources/application\.yml$''']
regexTarget = "secret"
regexes = [
  '''^mugsun\-api\-key16$''',
]

[[allowlists]]
# 1cbe7c0（test/sm4-selfcheck-followups，已推送，历史不能改）里的
# `APP_KEY = Sm4TestKeys.INTEGRATION_KEY`：命中值是常量引用的标识符，不是密钥字面量。
# 规则、文件、值三者同时匹配才放行（AND）；同文件里出现任何真实字面量仍会报。
# 不按 commit 放行，也不只按路径放行。
description = "Sm4KeyMigrationToolTest 的常量引用 Sm4TestKeys.INTEGRATION_KEY，非密钥（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^mugsun-boot-core/src/test/java/com/mugsun/boot/common/crypto/Sm4KeyMigrationToolTest\.java$''']
regexTarget = "secret"
regexes = [
  '''^Sm4TestKeys\.INTEGRATION_KEY$''',
]
