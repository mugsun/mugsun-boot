# 埋点模块配置（随 mugsun-boot-track jar 提供；核心通过 optional:classpath 引入）
mybatis-flex:
  datasource:
    # 埋点独立数据源（G99）：静态、租户无关；与业务库物理隔离（同实例独立 database，L1 层）
    track:
      type: hikari
      url: ${TRACK_JDBC_URL:jdbc:postgresql://localhost:5432/mugsun_track}
      username: ${TRACK_JDBC_USERNAME:mugsun}
      password: ${TRACK_JDBC_PASSWORD:mugsun}

mugsun:
  track:
    # 看板按天切分（趋势图、错误列表）用的时区：「今天」从当地 0 点开始。租户未配置时用 default-zone
    timezone:
      default-zone: ${MUGSUN_TRACK_TIMEZONE:Asia/Shanghai}
      # 按租户编号覆盖，键加中括号和引号：
      #   tenants:
      #     "[000000]": Asia/Shanghai
      tenants: {}
    enabled: ${MUGSUN_TRACK_ENABLED:true}
    flyway-enabled: ${MUGSUN_TRACK_FLYWAY_ENABLED:true}
    # 历史日表 UV 回填（distinct_id 口径，升级说明见 docs/upgrade/track-uv-backfill.md）
    uv-backfill:
      # 回填最近多少个闭合日（UTC），从昨天往前倒序
      days: ${MUGSUN_TRACK_UV_BACKFILL_DAYS:90}
      # 每处理完一个 应用×天 的间隔（毫秒）
      sleep-millis: ${MUGSUN_TRACK_UV_BACKFILL_SLEEP_MILLIS:300}
      # 单个 应用×天 事务的 statement_timeout（秒）
      statement-timeout-seconds: 120
      # 按 appKey 放宽超时（某个大应用单日总超时时用）。键必须加中括号和引号，否则会被小写化并去掉 . _：
      #   app-statement-timeout:
      #     "[MyApp_1]": 600s
      app-statement-timeout: {}
      # 单个 应用×天 事务内 SET LOCAL work_mem，减少 GROUPING SETS 排序落盘；留空沿用库默认
      work-mem: ${MUGSUN_TRACK_UV_BACKFILL_WORK_MEM:256MB}
      # 独立锁 TTL（秒），每个 应用×天 处理完续期
      lock-ttl-seconds: 600
      # 只在运行时段执行（默认北京时间 02:00–07:00）；false 表示不限
      window-enabled: ${MUGSUN_TRACK_UV_BACKFILL_WINDOW_ENABLED:true}
      window-start: "02:00"
      window-end: "07:00"
      window-zone: Asia/Shanghai
      # true：启动后在后台跑一遍（幂等；高峰期不要开，跑完关掉）
      on-startup: ${MUGSUN_TRACK_UV_BACKFILL_ON_STARTUP:false}
