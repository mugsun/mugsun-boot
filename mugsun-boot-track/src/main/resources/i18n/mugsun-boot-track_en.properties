事件缺少必填字段（event_id / distinct_id / session_id / ts）或字段超长，或事件列表格式不对。=The event is missing required fields (event_id / distinct_id / session_id / ts), a field is too long, or the event list has the wrong format.
令牌已过期。请重新进入圈选后再看草稿=The token has expired. Please start visual selection again and then view the drafts.
