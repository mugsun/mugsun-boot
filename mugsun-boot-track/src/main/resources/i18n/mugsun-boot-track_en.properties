请求过于频繁。请等一分钟后再上传这段响应体=Too many requests. Please wait a minute before uploading this response body.
请求过于频繁。请等一分钟后再上传这段回放=Too many requests. Please wait a minute before uploading this replay chunk.
请求过于频繁。请等一分钟后再上报事件=Too many requests. Please wait a minute before reporting events again.
请求过于频繁。请等一分钟后再上报这条草稿=Too many requests. Please wait a minute before reporting this draft.
请求过于频繁。请等一分钟后再查空间分析=Too many requests. Please wait a minute before querying spatial analysis.
请至少选择两个步骤。漏斗要按顺序看转化=Please select at least two steps. A funnel shows conversion in order.
请说明想看的指标，例如「最近 7 天概览」=Please describe the metric you want to see, for example "overview of the last 7 days"
请输入要问的问题=Please enter your question
请选择开始和结束时间，结束时间要晚于开始时间=Please choose the start and end time. The end time must be later than the start time.
调小 SDK 的 batchSize，或升级 SDK（新版自动分批）。=Lower the batchSize of the SDK, or upgrade the SDK (newer versions split batches automatically).
调小 SDK 的 batchSize；检查是否把大对象（整份响应、DOM、base64 图片）塞进了事件属性。=Lower the batchSize of the SDK. Check whether large objects (a whole response, the DOM, base64 images) were put into event properties.
负责人请控制在 64 个字以内=Please keep the owner within 64 characters
转化窗口只支持 1 小时、24 小时或 7 天。请从列表里重新选择=The conversion window only supports 1 hour, 24 hours or 7 days. Please choose again from the list.
