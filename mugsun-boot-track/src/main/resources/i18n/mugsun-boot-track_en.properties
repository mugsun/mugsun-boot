响应体服务繁忙，请重试=The response body service is busy. Please try again.
响应体脱敏请选择开启或关闭后再保存=Please turn response body masking on or off, then save
响应体解压后超界=The response body exceeds the limit after decompression
响应体采集请选择开启或关闭后再保存=Please turn response body capture on or off, then save
回放保留天数须 1..30。回放文件比事件大得多，请改到这个范围里再保存=Replay retention days must be 1..30. Replay files are much larger than events. Please change it to this range and save again.
