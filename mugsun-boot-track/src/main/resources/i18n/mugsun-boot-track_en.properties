会话标识不对。请用字母、数字、下划线或短横线，最长 {0} 位，再上传这段回放=The session ID is not valid. Please use letters, digits, underscores or hyphens, at most {0} characters, and upload this replay chunk again.
保存成功。「{0}」接入片段里的应用标识已经生成=Saved. The app key in the integration snippet of "{0}" has been generated.
保存成功。「{0}」采集会按这里的名称、采样率和开关执行=Saved. Collection for "{0}" will follow the name, sample rate and switches set here.
保留天数只支持 1 到 3650 天。请改到这个范围里再保存=Retention days must be between 1 and 3650. Please change it to this range and save again.
偶发可忽略；持续出现请联系运维检查对象存储和队列。=Occasional occurrences can be ignored. If it keeps happening, please ask operations to check the object storage and the queue.
先排查有没有异常流量在刷回放或响应体；正常增长就请管理员调高 track.storage.app-daily-max-bytes、track.storage.daily-max-bytes，或给存储盘扩容（剩余空间下限是 track.storage.min-free-bytes）。=First check whether abnormal traffic is flooding replays or response bodies. If it is normal growth, ask the administrator to raise track.storage.app-daily-max-bytes and track.storage.daily-max-bytes, or expand the storage disk (the minimum free space is track.storage.min-free-bytes).
分析维度不对。请从总览、事件、页面、来源或设备里重新选择=The analysis dimension is not valid. Please choose again from overview, event, page, source or device.
到「接入管理」打开这个应用的采集开关；如果是有意停用，请从页面里移除 SDK 初始化，避免白白发请求。=Turn on collection for this app in "Integration". If it was turned off on purpose, remove the SDK initialization from the page to avoid useless requests.
