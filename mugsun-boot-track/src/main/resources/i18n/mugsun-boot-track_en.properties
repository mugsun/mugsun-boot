# 后端提示语的英文翻译。等号左边是代码里的中文原文（一个字、一个标点都不能差），右边是英文。
#
# 怎么生效：请求头 Accept-Language 是英文时，返回体里的提示语（msg）整句在这里找得到就换成英文，
# 代码里用 I18n.get、I18n.translate 取的句子也到这里找；找不到照旧返回中文。
# 所以可以一批一批地加，没加到的句子不会出错。
#
# 写法：
#   1. 键里的等号写成 \=，其它字符（空格、冒号、中文标点）照原样写。
#   2. 原文里有 {0}、{1} 这种占位的（代码里用 I18n.get 写的句子），译文里也要有，次序可以调换。
#      这种句子原文和译文都按 MessageFormat 解析：单引号要写两个（It''s），字面的花括号写成 '{'、'}'。
#      占位里的值原样填进去，数字不加千分位。
#   3. 带数量的句子，译文按数量分单复数：{0} {0,choice,0#layers|1#layer|1<layers}
#      （0 个和多个用 layers，1 个用 layer）；只选词、不带数量：{0,choice,0#They|1#It|1<They}。
#   4. 会被连成一段的句子（代码里用 Sentences.join 连的多条提醒、多条修复说明），译文以句号结尾。
#   5. 代码里改了原文，这里要跟着改：I18nBundleTest 会检查这里的每一句都还在代码里。
#   6. 应用想改某一句的译文，不用动这个文件：在自己的 i18n/messages_en.properties 里写同一个键，优先用应用自己的。
#
# 按包分段，段内按原文排序。

# ==== track ====
