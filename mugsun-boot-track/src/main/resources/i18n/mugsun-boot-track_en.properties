请先进入圈选，再确认草稿=Please start visual selection first, then confirm the drafts
请先选中要圈的元素。没有选择器就无法上报这条草稿=Please select the element first. Without a selector this draft cannot be reported.
请先选择应用=Please select an app first
请先选择应用。分析是按应用分开的=Please select an app first. Analysis is separated by app.
请先选择应用。回放是按应用分开的=Please select an app first. Replays are separated by app.
请先选择应用。圈选规则是按应用分开的=Please select an app first. Visual rules are separated by app.
请先选择应用。漏斗是按应用分开的=Please select an app first. Funnels are separated by app.
请先选择应用。留存是按应用分开的=Please select an app first. Retention is separated by app.
请先选择应用。符号表是按应用分开的=Please select an app first. Sourcemaps are separated by app.
请先选择应用。行为记录是按应用分开的=Please select an app first. Activity records are separated by app.
请先选择用户。也可以切到访客，填上访客标识=Please select a user first. You can also switch to visitor and enter the visitor ID.
请先选择要上传的 .map 文件=Please choose the .map file to upload first
请先选择要上传符号表的应用=Please select the app to upload the sourcemap for first
请先选择要丢弃的草稿=Please select the drafts to discard first
请先选择要确认的草稿=Please select the drafts to confirm first
请同时传入问题单 id 与 appKey=Please pass both the issue id and appKey
请填写 Release。发布这个版本时用的就是这个名字=Please enter the Release. It is the name used when this version was released.
请填写应用名称=Please enter the app name
