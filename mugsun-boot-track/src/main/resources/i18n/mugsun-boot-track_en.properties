单会话回放体积超限。这个会话已经超过 {0} 字节，后面的内容不再接收，请换一个新会话再录=The replay of this session is over the size limit. The session has exceeded {0} bytes and no more content will be accepted. Please record in a new session.
单次上报的请求体超过服务端上限（413）。=The request body of one report is over the server limit (413).
同一 IP 对这个应用的上报超过每分钟上限（429）。=Reports from the same IP to this app are over the per-minute limit (429).
告警阈值须 1..{0}。这是 10 分钟内同一类错误的次数，请改到这个范围里再保存=The alert threshold must be from 1 to {0}. It is the number of errors of the same kind within 10 minutes. Please change it to a value in this range and save again.
响应体保留天数只支持 1 到 {0} 天。响应体比事件大得多，请改到这个范围里再保存=Response body retention only supports 1 to {0} days. Response bodies are much larger than events. Please change it to a value in this range and save again.
