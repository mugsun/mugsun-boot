这一段回放对不上。请回到列表重新打开=This replay chunk does not match. Please go back to the list and open it again.
这一段回放读不出来。请回到列表重新打开=This replay chunk cannot be read. Please go back to the list and open it again.
这个事件=this event
这个事件不存在。请刷新列表后再试=This event does not exist. Please refresh the list and try again.
这个会话对不上。请回到列表重新打开=This session does not match. Please go back to the list and open it again.
这个会话的回放已经超限，后面的内容不再接收。请换一个新会话再录=The replay of this session has exceeded the limit, and further content is no longer accepted. Please record again in a new session.
这个回放没有了。请回到列表重新打开=This replay no longer exists. Please go back to the list and open it again.
这个应用=this app
这个应用不存在。请刷新列表后再试=This app does not exist. Please refresh the list and try again.
这个应用不存在。请刷新应用列表后再上传=This app does not exist. Please refresh the app list before uploading.
这个应用不存在。请刷新应用列表后再看=This app does not exist. Please refresh the app list and check again.
这个应用今天的回放和响应体存储额度已经用完，这段响应体没有收下。请明天再试=The storage quota of this app for replays and response bodies is used up for today, so this response body was not accepted. Please try again tomorrow.
这个应用今天的回放和响应体存储额度已经用完，这段回放没有收下。请明天再试=The storage quota of this app for replays and response bodies is used up for today, so this replay chunk was not accepted. Please try again tomorrow.
这个应用没有打开会话回放。请到接入管理打开后再上传这段回放=Session replay is not turned on for this app. Please turn it on in Integration before uploading this replay chunk.
这个应用没有打开响应体采集。请到接入管理打开后再上传这段响应体=Response body capture is not turned on for this app. Please turn it on in Integration before uploading this response body.
这个应用的采集已关闭，服务端拒收全部上报。=Collection is turned off for this app, so the server rejects all reports.
这个开关请选择开启或关闭后再保存=Please turn this switch on or off, then save
这个文件不是合法的 JSON。请确认选的是构建产出的 .map=This file is not valid JSON. Please make sure you chose the .map produced by the build.
这个符号表=this sourcemap
这个符号表不存在。请刷新列表后再试=This sourcemap does not exist. Please refresh the list and try again.
这个符号表的文件不存在，或存储已经下线。请重新上传这个版本的符号表后再还原=The file of this sourcemap does not exist, or the storage is offline. Please upload the sourcemap of this version again and then restore.
这个符号表缺少 mappings 字段。请确认选的是构建产出的 .map=This sourcemap has no mappings field. Please make sure you chose the .map produced by the build.
这个草稿不存在，或已经处理过。请刷新后再看=This draft does not exist or has already been handled. Please refresh and check again.
这个规则不存在。请刷新列表后再试=This rule does not exist. Please refresh the list and try again.
这是服务端容量问题：联系运维检查埋点库写入和消费延迟，必要时扩容。=This is a server capacity problem. Ask operations to check writes to the analytics database and the consumer lag, and scale up if needed.
这条圈选不属于当前账号。请用签发时的账号操作=This visual selection does not belong to the current account. Please use the account that issued it.
这条圈选草稿读不出来。请重新进入圈选后再圈一次=This visual selection draft cannot be read. Please start visual selection again and select once more.
这条草稿=this draft
这条规则=this rule
这条记录对不上。请重新查询后再看响应体=This record does not match. Please search again and then view the response body.
这段响应体太大。单段内容最长 {0} 个字，请缩小后再上传=This response body is too large. One piece of content can be at most {0} characters. Please make it smaller and upload again.
这段响应体没有内容。请带上响应内容后再上传=This response body is empty. Please include the response content and upload again.
这段响应体没有采到，或已经清理。请到接入管理确认打开了响应体采集，再重新查询=This response body was not captured or has been cleaned up. Please make sure response body capture is turned on in Integration and search again.
这段响应体的内容编码不对。请按约定编码后再上传=The content encoding of this response body is not valid. Please encode it as agreed and upload again.
这段响应体的压缩内容损坏。请按约定压缩后再上传=The compressed content of this response body is corrupted. Please compress it as agreed and upload again.
这段响应体的明文太大。明文最长 {0} 字节，请缩小后再上传=The plain content of this response body is too large. It can be at most {0} bytes. Please make it smaller and upload again.
这段响应体解压后太大。解压后最长 {0} 字节，请缩小后再上传=This response body is too large after decompression. It can be at most {0} bytes after decompression. Please make it smaller and upload again.
这段回放太大。单块内容最长 {0} 个字，请缩小后再上传=This replay chunk is too large. One chunk can be at most {0} characters. Please make it smaller and upload again.
这段回放没有内容。请带上录制内容后再上传=This replay chunk is empty. Please include the recorded content and upload again.
这段回放的内容不是合法的 JSON。请改成 JSON 后再上传=The content of this replay chunk is not valid JSON. Please change it to JSON and upload again.
这段回放的内容编码不对。请按约定编码后再上传=The content encoding of this replay chunk is not valid. Please encode it as agreed and upload again.
这段回放的压缩内容损坏。请按约定压缩后再上传=The compressed content of this replay chunk is corrupted. Please compress it as agreed and upload again.
这段回放的明文太大。明文最长 {0} 字节，请缩小后再上传=The plain content of this replay chunk is too large. It can be at most {0} bytes. Please make it smaller and upload again.
这段回放解压后太大。解压后最长 {0} 字节，请缩小后再上传=This replay chunk is too large after decompression. It can be at most {0} bytes after decompression. Please make it smaller and upload again.
这段回放须是一个事件列表。请把录制事件放进列表后再上传=This replay chunk must be a list of events. Please put the recorded events in a list and upload again.
选择器最长 {0} 个字。请重新选择一个更短的元素后再上报=A selector can be at most {0} characters. Please select an element with a shorter selector and report again.
采样率只支持 1 到 100。100 表示全量采集，请改到这个范围里再保存=The sample rate must be between 1 and 100. A value of 100 means capturing everything. Please change it to this range and save again.
采集开关请选择开启或关闭后再保存=Please turn collection on or off, then save
问题单不存在或无权访问。请刷新列表后再看=The issue does not exist or you have no access. Please refresh the list and check again.
问题请控制在 {0} 字以内=Please keep the question within {0} characters
需要回放就到「接入管理」打开会话回放；不需要就别加载回放插件，省流量。=If you need replays, turn on session replay in "Integration". If not, do not load the replay plugin, to save traffic.
需要的话到「接入管理」打开响应体采集；否则在 SDK 关闭 apiMonitor 的 body 采集。=If you need it, turn on response body capture in "Integration". Otherwise turn off body capture of apiMonitor in the SDK.
页面路径请控制在 {0} 个字以内=Please keep the route path within {0} characters

