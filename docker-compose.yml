# Mugsun 本地基础设施（PostgreSQL + Redis）
# 用法（在 mugsun-boot 目录）：
#   docker compose up -d
# 容器名与 README / e2e 一致：mugsun-pg、mugsun-redis。
# 后端仍在宿主机以 jar/mvn 启动，默认连 localhost:5432 / 6379；端口可用 MUGSUN_DB_PORT / MUGSUN_REDIS_PORT 一并改。
#
# 默认账号与 application.yml 对齐（仅本机开发）：库用户 mugsun/mugsun，Redis 无密码 db 3。
# PowerJob Server 不在默认编排内；Worker 默认关闭。需要定时任务时自行起 Server 并设 POWERJOB_ENABLED=true。

services:
  postgres:
    # 必须是带 PostGIS 的镜像，不能退回 postgres:16-alpine：
    # GIS 的空间查询下沉、GiST 索引与矢量瓦片全靠 PostGIS 扩展（见 0.1 基线中的 gis_feature 段）。
    # 没有扩展时应用不会报错，而是静默全量回落 Java 侧——查询慢数倍、矢量瓦片直接不可用，
    # 且只留一行 WARN 日志，运维极难发现。所以镜像即交付物，别在本地手工 apt 装扩展了事。
    # 默认拉取 GHCR 多架构镜像（linux/amd64 + linux/arm64），Mac/PC 都不用本地构建，
    # 也不必再设 MUGSUN_PG_PLATFORM / MUGSUN_PG_BASE_IMAGE。
    # 钉 digest（可复现）：MUGSUN_PG_IMAGE=ghcr.io/mugsun/postgis-pgvector@sha256:...
    #   查 digest：docker buildx imagetools inspect ghcr.io/mugsun/postgis-pgvector:16-3.4
    # 改 Dockerfile 本地重建：docker compose build postgres（仍可用下方 build）
    image: ${MUGSUN_PG_IMAGE:-ghcr.io/mugsun/postgis-pgvector:16-3.4}
    pull_policy: missing
    build:
      context: ./docker/postgres
    container_name: mugsun-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MUGSUN_POSTGRES_SUPER_PASSWORD:-postgres}
      MUGSUN_DB_PASSWORD: ${MUGSUN_DB_PASSWORD:-mugsun}
    ports:
      # 本机 5432 已被占用时：MUGSUN_DB_PORT=55432 docker compose up -d，后端同样导出 MUGSUN_DB_PORT
      - "${MUGSUN_DB_PORT:-5432}:5432"
    volumes:
      - mugsun-pg-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/initdb/init-db.sql:ro
      - ./docker/postgres/00-init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mugsun-redis
    ports:
      - "${MUGSUN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mugsun-pg-data:
