# Mugsun 本地基础设施（PostgreSQL + Redis）
# 用法（在 mugsun-boot 目录）：
#   docker compose up -d
# 容器名与 README / e2e 一致：mugsun-pg、blade-redis。
# 后端仍在宿主机以 jar/mvn 启动，连 localhost:5432 / 6379。
#
# 默认账号与 application.yml 对齐（仅本机开发）：库用户 mugsun/mugsun，Redis 无密码 db 3。
# PowerJob Server 不在默认编排内；Worker 默认关闭。需要定时任务时自行起 Server 并设 POWERJOB_ENABLED=true。

services:
  postgres:
    # 必须是带 PostGIS 的镜像，不能退回 postgres:16-alpine：
    # GIS 的空间查询下沉、GiST 索引与矢量瓦片全靠 PostGIS 扩展（见 V79 迁移）。
    # 没有扩展时应用不会报错，而是静默全量回落 Java 侧——查询慢数倍、矢量瓦片直接不可用，
    # 且只留一行 WARN 日志，运维极难发现。所以镜像即交付物，别在本地手工 apt 装扩展了事。
    # 官方 postgis/postgis 目前仅发布 amd64；Apple Silicon 上 Docker Desktop 会自动走仿真。
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: mugsun-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MUGSUN_POSTGRES_SUPER_PASSWORD:-postgres}
      MUGSUN_DB_PASSWORD: ${MUGSUN_DB_PASSWORD:-mugsun}
    ports:
      - "5432:5432"
    volumes:
      - mugsun-pg-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/initdb/init-db.sql:ro
      - ./docker/postgres/00-init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blade-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mugsun-pg-data:
