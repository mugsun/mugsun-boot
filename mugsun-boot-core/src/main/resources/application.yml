server:
  port: 8080
  # 优雅停机：停接新请求、等待在途请求处理完毕，滚动发布/重启不硬砍在途请求
  shutdown: graceful
spring:
  application:
    name: mugsun-boot
  # 本地密钥/验证码回显：把 config/application-local.yml.example 复制为 application-local.yml（gitignore）
  config:
    import:
      # 可选模块自带配置（jar 不在 classpath 时 optional 静默跳过）
      - optional:classpath:mugsun-module-track.yml
      - optional:classpath:mugsun-module-gis.yml
      - optional:classpath:mugsun-module-ai.yml
      # 本地覆盖必须排在最后：import 列表后者覆盖前者，排在模块前会被模块默认值（如 track 数据源 URL）静默盖掉
      - optional:file:./config/application-local.yml
  lifecycle:
    # 优雅停机在途请求最长等待
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # 附件与 G101 sourcemap 上限都是 20MB：容器在流式阶段截断，超限由 UploadSizeExceptionAdvice 给 400
      max-file-size: 20MB
      max-request-size: 21MB
  task:
    scheduling:
      pool:
        # 调度线程池显式扩容：多调度任务（通知重试/日志清理）互不饿死
        size: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    placeholder-replacement: false
  data:
    redis:
      # 本机已有 Redis 占 6379 时：导出 MUGSUN_REDIS_PORT（compose 映射端口同一变量）
      host: ${MUGSUN_REDIS_HOST:localhost}
      port: ${MUGSUN_REDIS_PORT:6379}
      database: 3
      timeout: 3000ms
  mail:
    host: smtp.example.com
    port: 465
    username: placeholder@example.com
    password: placeholder
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
management:
  # 邮件为尽力而为通道：默认关闭 mail 健康指标，避免占位/未配真实 SMTP 时 /actuator/health 聚合恒 503（配真实 SMTP 后可开启）
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus/metrics 由 ActuatorAuthFilter 门控（登录 + sys:monitor:list）；health/info 保持公开
        include: health,info,metrics,prometheus
  # Boot 3.5 起 management.defaults.metrics.export.enabled 默认视为 false，Prometheus 注册表须显式开启
  prometheus:
    metrics:
      export:
        enabled: true
# 日志收口 logback-spring.xml：控制台/文件级别段均注入 traceId（TraceIdFilter 写 MDC）；
# 默认落盘 ./logs（logging.file.path 可覆盖），按天+100MB 双滚动，error 单独成文件保留 90 天
sa-token:
  token-name: Authorization
  timeout: 2592000
  token-style: uuid
  is-log: false
  # 并发登录控制：允许同账号多端在线（is-concurrent），各端独立 token（is-share=false，方可按 token 踢单端），单账号最大并发终端数
  is-concurrent: true
  is-share: false
  max-login-count: 12
mybatis-flex:
  datasource:
    primary:
      type: hikari
      # 本机已有 PG 占 5432 时：导出 MUGSUN_DB_PORT（compose 映射端口同一变量）；整条 URL 可用 MUGSUN_DB_URL 覆盖
      url: ${MUGSUN_DB_URL:jdbc:postgresql://${MUGSUN_DB_HOST:localhost}:${MUGSUN_DB_PORT:5432}/${MUGSUN_DB_NAME:mugsun}}
      username: ${MUGSUN_DB_USERNAME:mugsun}
      password: ${MUGSUN_DB_PASSWORD:mugsun}
  default-datasource-key: primary
  global-config:
    print-banner: false
    tenant-column: tenant_id
jetcache:
  statIntervalMinutes: 1
  areaInCacheName: false
  local:
    default:
      type: linkedhashmap
      keyConvertor: bean:tenantKeyConvertor
      limit: 500
      expireAfterWriteInMillis: 3600000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: bean:tenantKeyConvertor
      valueEncoder: bean:jsonValueEncoder
      valueDecoder: bean:jsonValueDecoder
      uri: redis://${MUGSUN_REDIS_HOST:localhost}:${MUGSUN_REDIS_PORT:6379}/3
dromara:
  x-file-storage:
    default-platform: local-plus-1
    local-plus:
      - platform: local-plus-1
        enable-storage: true
        enable-access: true
        domain: http://127.0.0.1:8080/file/
        base-path: mugsun/
        path-patterns: /file/**
        storage-path: /tmp/mugsun-files/
sms:
  config-type: yaml
  blends:
    default:
      supplier: alibaba
      access-key-id: placeholder
      access-key-secret: placeholder
      signature: mugsun
      template-id: SMS_000000
powerjob:
  worker:
    enabled: false
    app-name: mugsun
    server-address: 127.0.0.1:7700
    protocol: http
    store-strategy: disk
    port: 27777
liteflow:
  rule-source: flow/*.el.xml
mugsun:
  file:
    local-access:
      # 本地存储直出 /file/**：公开前缀匿名可取，其余对象须带短时签名（授权下载接口签发）
      url-prefix: /file/
      public-prefixes:
        - mugsun/public/
      # HMAC 密钥，多实例必须配置为同一值（≥32 字符）；留空则启动随机生成（仅单实例开发）
      sign-secret: ${MUGSUN_FILE_SIGN_SECRET:}
      expire-seconds: 300
  openapi:
    # 可信反向代理（CIDR 列表，逗号分隔，如 10.0.0.0/8,::1/128）。默认空：只用 remoteAddr，忽略 X-Forwarded-For。
    # 仅当 remoteAddr 落在此列表内时，才从 X-Forwarded-For 右往左取第一个不在列表内的地址作为客户端 IP。
    trusted-proxies: ${MUGSUN_OPENAPI_TRUSTED_PROXIES:}
  ai:
    outbound:
      # AI 出站（知识库抓取 / 渠道 Webhook / MCP 远程）SSRF 白名单；默认空 = 一律拒绝内网/回环/元数据地址。
      # 支持精确主机与 *.example.com 通配；命中即放行内网地址，如本地 Ollama：[localhost, ollama.internal]
      allow-hosts: []
  web:
    # 管理端 origin；e2e :3007 / 反代域名设 MUGSUN_FRONT_URL，禁止代码写死端口
    front-url: ${MUGSUN_FRONT_URL:http://localhost:3006}
  captcha:
    enabled: true            # 全局开关，false = 所有场景都不要验证码；与租户开关(sys_tenant.captcha_enabled)取 AND
    # 租户未单独设置时启用的题型（服务端随机选一种）：SLIDER | ROTATE | WORD_CLICK | ICON_CLICK | JIGSAW，不区分大小写。
    # 默认五种全开、随机出题；ROTATE / ICON_CLICK 只能部分抵御自动求解，不要单独启用。非法值（含已移除的 IMAGE）启动失败
    default-types: SLIDER,WORD_CLICK,ROTATE,ICON_CLICK,JIGSAW
    store: redis             # redis | memory（memory 仅单机/开发，prod profile 启动即失败）
    show-code: false         # 双因子登录验证码回显，仅 dev profile 开启（生产开启=防爆破体系架空）
    slider:
      width: 320             # 底图原始尺寸（前端按显示宽度缩放，answer.x 按 width/bgDisplayWidth 换算）
      height: 180
      piece-size: 46
      expire-seconds: 120    # 挑战有效期
      token-expire-seconds: 120
      tolerance-px: 6        # 落点/轨迹位移容差（底图原始像素）
      min-duration-ms: 300   # 服务端计时下限（签发→校验）与指针模式客户端时长下限
      max-duration-ms: 15000
      min-track-points: 8
      max-track-points: 400
      keyboard-min-duration-ms: 600
      keyboard-min-key-presses: 3
      keyboard-max-key-presses: 300
      keyboard-step-px: 4    # 键盘模式每次按键移动的原始像素，challenge 下发 keyboardStep
      decoy-count: 2         # 假缺口数（与真缺口同轮廓），0–3
      bind-ip: false         # token 强制绑定 IP 哈希（默认只记录）
      bind-ua: false         # prod 为 true
    background:
      dir: classpath:captcha/bg/   # 或 file:/opt/mugsun/captcha-bg/；jpg/png，推荐 640×360，为空时纯色占位
      rotate: random               # random | round-robin
      reload-seconds: 600          # 目录重扫间隔，0=仅启动加载
      placeholder-color: "#E6F4FF"
    rate-limit:
      challenge-per-minute: 30     # 单 IP 每分钟取挑战
      global-challenge-per-second: 200   # 全局每秒上限（redis 跨节点；memory 单节点）
      verify-fail-max: 5           # 指针模式窗口内失败上限
      keyboard-fail-max: 3         # 键盘模式（更严）
      keyboard-verify-per-minute: 6
      fail-window-seconds: 600
      lock-seconds: 600
      sms-phone-per-day: 10        # 发送短信：单手机号每天
      sms-ip-per-hour: 20          # 发送短信：单 IP 每小时
      sms-phone-per-minute: 5      # 发送短信短窗口：单手机号每分钟（含无 token 请求，自动恢复）
      sms-ip-per-minute: 30        # 发送短信短窗口：单 IP 每分钟
  sms:
    show-code: false         # 短信验证码回显仅 dev profile 开启（生产开启=未认证接管任意账号）
  crypto:
    gm-enabled: ${MUGSUN_GM_ENABLED:true}          # 国密总开关（传输 SM2 / 摘要 SM3 一处切）
    sm4-key: ${MUGSUN_SM4_KEY:}                     # SM4 字段加密密钥（生产必须环境变量注入，缺省拒绝启动明文提示）
    api-key: ${MUGSUN_API_KEY:}                     # 接口传输 SM4-GCM 密钥：32 位 hex（openssl rand -hex 16）
    strict-keys: ${MUGSUN_STRICT_KEYS:false}        # 生产 true：密钥缺失即拒绝启动
    sm2-private-key: ${MUGSUN_SM2_PRIVATE_KEY:}     # SM2 传输私钥 hex（留空则启动生成并告警）
    sm2-public-key: ${MUGSUN_SM2_PUBLIC_KEY:}       # SM2 传输公钥 hex（04+128）
    sign-private-key: ${MUGSUN_SIGN_PRIVATE_KEY:}   # 审计签名 SM2 私钥（与传输分离，生产必须固定注入）
    sign-public-key: ${MUGSUN_SIGN_PUBLIC_KEY:}     # 审计签名 SM2 公钥
  serial-number:
    provider: redis          # redis 自增（默认）/ db 行锁
  websocket:
    sender-type: redis       # 推送扇出：local=单机直发（仅本地调试）/ redis=集群经 Redis Pub/Sub 扇出
  social:
    enabled: ${MUGSUN_SOCIAL_ENABLED:true}
    # mock 社交来源仅 dev profile 配置（身份固定=后门，主配置绝不携带）
    mock-enabled: ${MUGSUN_SOCIAL_MOCK:false}
  ip2region:
    # 离线 IP 归属地（登录日志 login_location 列）：缺省关闭。
    # xdb 数据文件（约 11MB）不入库——官方仅经 GitHub 仓库 data/ 分发且不定期更新，
    # 开启步骤：下载 https://github.com/lionsoul2014/ip2region/raw/master/data/ip2region_v4.xdb
    # 至服务器本地目录，xdb-path 指向该文件后 enabled=true。
    enabled: ${MUGSUN_IP2REGION_ENABLED:false}
    xdb-path: ${MUGSUN_IP2REGION_XDB_PATH:}
