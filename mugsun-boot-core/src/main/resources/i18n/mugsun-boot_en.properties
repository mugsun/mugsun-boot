# ==== system/service ====
AI 节点失败策略无效。请改成 rejectLast、stay 或 transfer:role:<角色码> 后再发布=The failure policy of the AI node is invalid. Please change it to rejectLast, stay or transfer:role:<role code> and publish again.
AI 节点超时须 ≤ 300000 毫秒。请改小后再发布=The AI node timeout must not exceed 300000 ms. Please reduce it and publish again.
AI 节点输出映射目标键非法（仅 ai_summary/ai_pass/ai_reason/ai_run_id 或 ai_ext_*）。请改映射后再发布=The output mapping of the AI node has an invalid target key (only ai_summary, ai_pass, ai_reason, ai_run_id or ai_ext_* are allowed). Please fix the mapping and publish again.
AI 节点配置序列化失败。请重新配置后再发布=Failed to serialize the AI node configuration. Please configure it again and publish again.
一次最多抄送 20 人。请减少后再提交=You can CC at most 20 people at a time. Please reduce the number and submit again.
一次最多选择 20 人。请减少后再提交=You can select at most 20 people at a time. Please reduce the number and submit again.
不支持的条件运算符。请改成等于、不等于、大于、大于等于、小于、小于等于、包含或不包含后再发布=This condition operator is not supported. Please use equal, not equal, greater than, greater or equal, less than, less or equal, contains or not contains, and publish again.
不能修改自己的角色。需要调整请找管理员=You cannot change your own roles. Please ask an administrator if a change is needed.
不能停用当前登录的账号。请把状态改回启用，或换一个账号登录后再停用=You cannot disable the account you are signed in with. Please set the status back to enabled, or sign in with another account and disable it from there.
任务服务暂时连不上。请确认地址可以访问，然后重新同步。=The job server cannot be reached right now. Please make sure the address is accessible and sync again.
任务服务没有接受这次登记。请核对应用名称和口令后再同步。=The job server did not accept this registration. Please check the app name and password and sync again.
会签比例须为 0 到 100 的整数。请改成这个范围里的整数后再发布=The countersign ratio must be an integer from 0 to 100. Please change it to an integer in that range and publish again.
你已经绑定了一个这个来源的账号。要换绑，请先在个人中心解绑=You have already bound an account from this provider. To bind a different one, please unbind the current one in the User Center first.
内置管理员角色仅管理员可授予=Only administrators can grant the built-in administrator role
只有这条待办的办理人可以抄送。请刷新列表，确认它还在你的待办里=Only the handler of this task can CC others. Please refresh the list and make sure it is still in your Todo list.
只有这条待办的办理人可以选人。请刷新列表，确认它还在你的待办里=Only the handler of this task can select people. Please refresh the list and make sure it is still in your Todo list.
只能退回到前面已经办过的审批节点。请从可退回的节点里重新选择=You can only return to an approval node that has already been handled. Please choose again from the nodes that can be returned to.
同时创建的租户较多，请稍后重试=Too many tenants are being created at the same time. Please try again later.
图片不能超过 5MB。请压缩后再上传=The image must not exceed 5 MB. Please compress it and upload again.
图片内容和扩展名对不上。请上传原始图片，不要只改扩展名=The image content does not match its extension. Please upload the original image instead of only changing the extension.
图片没有上传成功。请稍后再试，或联系管理员检查存储配置=The image was not uploaded. Please try again later, or contact an administrator to check the storage configuration.
图片读不出来。请换一张图片再试=The image cannot be read. Please try another image.
地址可以连上。启用后，新上传的文件会存到这套存储=The address is reachable. Once enabled, newly uploaded files will be saved to this storage.
地址需要以 http:// 或 https:// 开头，只包含主机和端口。例如 http://127.0.0.1:7700=The address must start with http:// or https:// and contain only a host and a port, for example http://127.0.0.1:7700
备注请控制在 200 字以内=Please keep the remark within 200 characters
头像只支持 png、jpg、gif、webp 图片。请换一张图片再上传=Avatars only support png, jpg, gif and webp images. Please upload another image.
头像只能使用你自己上传的公开图片。请重新上传头像后再保存=The avatar must be a public image that you uploaded yourself. Please upload the avatar again and then save.
头像图片不能超过 2MB。请压缩后再上传=The avatar image must not exceed 2 MB. Please compress it and upload again.
头像没有上传成功。请稍后再试，或联系管理员检查存储配置=The avatar was not uploaded. Please try again later, or contact an administrator to check the storage configuration.
字段权限序列化失败。请重新配置字段权限后再发布=Failed to serialize the field permissions. Please configure the field permissions again and publish again.
