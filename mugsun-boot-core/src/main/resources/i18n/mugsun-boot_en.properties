头像只能使用你自己上传的公开图片。请重新上传头像后再保存=The avatar must be a public image that you uploaded yourself. Please upload the avatar again and then save.
头像图片不能超过 2MB。请压缩后再上传=The avatar image must not exceed 2 MB. Please compress it and upload again.
头像没有上传成功。请稍后再试，或联系管理员检查存储配置=The avatar was not uploaded. Please try again later, or contact an administrator to check the storage configuration.
字段权限序列化失败。请重新配置字段权限后再发布=Failed to serialize the field permissions. Please configure the field permissions again and publish again.
审批意见请控制在 200 个字以内=Please keep the approval comment within 200 characters
已同步到任务服务=Synced to the job server
平台租户不能停用。停用后所有人都会无法登录，请保持为正常=The platform tenant cannot be disabled. Nobody could sign in if it were disabled. Please keep its status as normal.
应用写不了这个目录。请检查目录权限后再试=The application cannot write to this directory. Please check the directory permissions and try again.
应用口令请控制在 64 字以内=Please keep the app password within 64 characters
应用名称请使用字母开头，只含字母、数字、下划线或中划线=The app name must start with a letter and contain only letters, digits, underscores or hyphens
按你的数据范围，保存后你将看不到这名用户，所以没有保存。请把部门选在你的数据范围内；确实要放到别的部门，请联系数据范围更大的管理员=With your data scope you would no longer see this user after saving, so nothing was saved. Please choose a department within your data scope. If the user really belongs to another department, please contact an administrator with a wider data scope.
授权已过期或已经用过。请回到原来的页面重新发起授权=The authorization has expired or has already been used. Please go back to the original page and start the authorization again.
无启用短信配置=No SMS configuration is enabled
无权查看该流程。请换有权限的账号打开，或回到自己的待办列表=You do not have permission to view this flow. Please open it with an account that has permission, or go back to your own Todo list.
有办理人不存在，或不属于当前租户。请重新选择后再提交=Some handlers do not exist or do not belong to the current tenant. Please select again and submit.
有租户不存在。请刷新列表后再删除=Some tenants do not exist. Please refresh the list and delete again.
有租户不存在，或已经被删除。请刷新列表后再试=Some tenants do not exist or have already been deleted. Please refresh the list and try again.
有角色不存在，或属于其他租户。请重新选择角色=Some roles do not exist or belong to another tenant. Please select the roles again.
服务名称已存在，请换一个=The server name already exists. Please use another one.
服务地址看不懂。请写成 http://主机:端口 这样的形式后再检查=The server address cannot be parsed. Please write it in the form http://host:port and check again.
未知节点类型。请改成审批、条件、并行或 AI 预审后再发布=This node type is not recognized. Please change it to approval, condition, parallel or AI pre-review and publish again.
本地存储请填写目录。请先在表单里填好本机目录再检查=A directory is required for local storage. Please fill in the local directory in the form first and then check.
条件值含非法字符（不能包含 | 或 @@ 或换行）。请去掉这些字符后再发布=The condition value contains characters that are not allowed (it must not contain |, @@ or line breaks). Please remove them and publish again.
条件变量名非法。请改成以字母或下划线开头，并且只含字母、数字和下划线后再发布=The condition variable name is not valid. Please start it with a letter or an underscore, use only letters, digits and underscores, and publish again.
条件规则缺少字段或运算符。请补上字段和运算符后再发布=The condition rule is missing a field or an operator. Please fill in both and publish again.
正文里只能插入 png、jpg、gif、webp 图片。请换一张图片再上传=Only png, jpg, gif and webp images can be inserted into the content. Please upload another image.
没能生成可用的租户编号，请稍后重试=Could not generate an available tenant ID. Please try again later.
流程定义序列化失败。请重新打开设计页后再发布=Failed to serialize the flow definition. Please reopen the designer and publish again.
流程实例不存在。请刷新列表，核对单号后再看=The flow instance does not exist. Please refresh the list and check the ID.
流程实例编号请填写数字，可以从列表里复制=The flow instance ID must be a number. You can copy it from the list.
流程编码与名称不能为空。请填上编码和名称后再发布=The flow code and name are required. Please fill in both and publish again.
流程编码请控制在 40 字以内=Please keep the flow code within 40 characters
演示环境不发送短信=The demo environment does not send SMS messages
状态只能选择正常或停用=The status must be either normal or disabled
短信没有发出去。请核对签名、模板和密钥，确认账号可用后再试=The SMS was not sent. Please check the signature, the template and the keys, make sure the account is usable, and try again.
短信通道未配置=The SMS channel is not configured
租户名称请控制在 64 个字以内=Please keep the tenant name within 64 characters
端口需要在 1 到 65535 之间。例如 http://127.0.0.1:7700=The port must be between 1 and 65535, for example http://127.0.0.1:7700
第三方授权失败。请回到登录页，重新发起授权后再试=Third-party authorization failed. Please go back to the sign-in page and start the authorization again.
终止原因请控制在 200 字以内=Please keep the stop reason within 200 characters
编辑用户不能改密码。要给这名用户换密码，请在用户列表里点「重置密码」=The password cannot be changed when editing a user. To change the password of this user, click "Reset Password" in the user list.
联系人请控制在 32 个字以内=Please keep the contact name within 32 characters
联系电话请填写 11 位手机号。不需要联系电话可以留空=The contact phone must be an 11-digit mobile number. Leave it empty if no contact phone is needed.
试写文件没有成功。请检查目录权限后再试=The test write failed. Please check the directory permissions and try again.
试发已提交。请看手机是否收到；没收到就核对模板是不是只需要一个验证码变量=The test message has been submitted. Please check whether the phone received it. If not, check whether the template needs only one verification code variable.
试发没有成功。请核对签名、模板编号和密钥，确认账号可用后再试=The test message failed. Please check the signature, the template ID and the keys, make sure the account is usable, and try again.
该第三方账号尚未绑定平台用户，请先登录并绑定后再使用第三方登录=This third-party account is not bound to a platform user yet. Please sign in and bind it first, then use third-party sign-in.
该第三方账号已绑定其他用户=This third-party account is already bound to another user
请从列表中选择一套任务服务后再操作=Please select a job server from the list first
请从列表中选择一条正在办理的流程=Please select a flow in progress from the list
请从列表里选择一套存储后再检查=Please select a storage from the list and then check
请从列表里选择一套短信配置后再试发=Please select an SMS configuration from the list and then send a test message
请先勾选要删除的任务服务=Please select the job servers to delete first
请先填好短信签名和模板编号，再试发=Please fill in the SMS signature and the template ID before sending a test message
请先选择办理人。可以按用户名或昵称搜索=Please select a handler first. You can search by username or nickname.
请先选择抄送人。可以按用户名或昵称搜索=Please select the people to CC first. You can search by username or nickname.
请先选择要删除的租户=Please select the tenants to delete first
请填写 11 位手机号，再发送这条试发短信=Please enter an 11-digit mobile number before sending this test message
请填写应用名称。它要和任务服务里的应用一致=Please enter the app name. It must match the app on the job server.
请填写服务地址。例如 http://127.0.0.1:7700=Please enter the server address, for example http://127.0.0.1:7700
请填写租户名称=Please enter the tenant name
请填写租户名称后再创建=Please enter the tenant name before creating the tenant
请填写终止原因，方便发起人知道流程为什么被停下=Please enter the stop reason so that the initiator knows why the flow was stopped
请选择一张图片作为头像=Please choose an image as the avatar
请选择一张有内容的图片再上传=Please choose an image that is not empty and upload again
请选择本地存储、MinIO 或阿里云=Please choose local storage, MinIO or Alibaba Cloud
请选择转办、委派、加签或减签=Please choose Transfer, Delegate, Add Signatory or Remove Signatory
请选择退回节点=Please choose the node to return to
账号上限请填 -1（不限制）或大于等于 0 的整数=The account limit must be -1 (unlimited) or an integer greater than or equal to 0
还没有任务服务。请先登记名称、地址和应用后再同步=There is no job server yet. Please register the name, the address and the app first and then sync.
这个业务单号已经发起过这个流程，还没有办完。请到审批中心的我发起里查看，不用重复提交=This business ID has already started this flow, and it is not finished yet. Please check it under "Started by Me" in the Approval Center. There is no need to submit again.
这个业务单号已经用来请过假。请换一个单号，或到审批中心的我发起里查看原来那张=This business ID has already been used for a leave request. Please use another ID, or check the original request under "Started by Me" in the Approval Center.
这个任务不存在，或还没轮到你签收。请刷新待签列表=This task does not exist, or it is not your turn to claim it yet. Please refresh the To Claim list.
这个任务已经签收，请到待办里办理=This task has already been claimed. Please handle it in Todo.
这个套餐不存在。请重新选择套餐，或先不选套餐=This plan does not exist. Please choose a plan again, or leave the plan empty for now.
这个套餐不存在。请重新选择套餐，或清空套餐表示不限功能=This plan does not exist. Please choose a plan again, or clear the plan to allow all features.
这个流程不存在，或属于其他租户。请刷新列表后再看=This flow does not exist or belongs to another tenant. Please refresh the list and check again.
这个流程不存在，或属于其他租户。请刷新列表后再试=This flow does not exist or belongs to another tenant. Please refresh the list and try again.
这个流程已经挂起。可以先恢复，或填写原因后终止=This flow is already suspended. You can resume it first, or enter a reason and stop it.
这个流程已经结束，不能再操作。请刷新列表=This flow has already ended and can no longer be changed. Please refresh the list.
这个流程暂时不能终止。请刷新列表确认它还在办理中，再填写原因后重试=This flow cannot be stopped right now. Please refresh the list to make sure it is still in progress, then enter a reason and try again.
这个流程正在办理，不用恢复。需要停下来请先挂起，或填写原因后终止=This flow is in progress and does not need to be resumed. To pause it, suspend it first, or enter a reason and stop it.
这个用户不在你的数据范围内，不能操作。请刷新列表后再试；确实需要处理，请联系数据范围更大的管理员=This user is outside your data scope, so you cannot operate on this user. Please refresh the list and try again. If you really need to handle this user, please contact an administrator with a wider data scope.
这个目录可以写入。启用后，新上传的文件会存到这里=This directory is writable. Once enabled, newly uploaded files will be saved here.
这个目录还不存在，或不是文件夹。请先在服务器上建好目录后再检查=This directory does not exist yet, or it is not a folder. Please create the directory on the server first and then check.
这个租户不存在。请刷新列表后再编辑=This tenant does not exist. Please refresh the list and edit again.
这套任务服务不存在，或属于其他租户。请刷新列表后再试=This job server does not exist or belongs to another tenant. Please refresh the list and try again.
这套存储暂时连不上。请检查地址、桶名和密钥是否正确后再试=This storage cannot be reached right now. Please check that the address, the bucket name and the keys are correct and try again.
这套配置还没有密钥。请先填好 AccessKey 和 SecretKey 再试发=This configuration has no keys yet. Please fill in the AccessKey and the SecretKey before sending a test message.
这张单子正在发起，还没有处理完。请不要重复提交，稍后到审批中心的我发起里查看=This request is being started and has not finished processing. Please do not submit it again. Check it later under "Started by Me" in the Approval Center.
这是管理员账号，只有管理员能调整它的角色=This is an administrator account. Only administrators can change its roles.
这条待办不存在，或已经办完。请刷新列表后再操作=This task does not exist or has already been handled. Please refresh the list and try again.
这次授权不是从登录页发起的，不能用来登录。请回到登录页重新发起第三方登录=This authorization was not started from the sign-in page, so it cannot be used to sign in. Please go back to the sign-in page and start third-party sign-in again.
这次授权不是你在个人中心发起的绑定，已拒绝。要绑定请到个人中心重新点「绑定」=This authorization is not a binding that you started in the User Center, so it was rejected. To bind an account, go to the User Center and click "Bind" again.
通知不存在=The notice does not exist
非法租户号=Invalid tenant ID

